<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>$pagetitle$</title>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #ffffff;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --plane: #f4f3ef;
    --accent: #1c5cab;
  }
  @page { size: A4; margin: 11mm 13mm 13mm 13mm; }
  * { box-sizing: border-box; }
  html { background: var(--page); }
  body {
    margin: 0 auto;
    max-width: 184mm;
    padding: 0;
    color: var(--ink);
    font-family: "IPAPGothic", "IPAGothic", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    font-size: 8.8pt;
    line-height: 1.55;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  @media screen { body { padding: 10mm 0 16mm; } }
  h1 { font-size: 14.5pt; line-height: 1.3; margin: 0 0 2.4mm; }
  h2 {
    font-size: 11pt; margin: 3.4mm 0 1.6mm; padding: 0.6mm 0 0.6mm 2.2mm;
    border-left: 1.1mm solid var(--accent); line-height: 1.35; break-after: avoid;
  }
  p { margin: 0 0 1.4mm; }
  ol, ul { margin: 0 0 1.6mm; padding-left: 5mm; }
  li { margin: 0.3mm 0; }
  li > ul { margin: 0.3mm 0 0; }
  code {
    font-family: "DejaVu Sans Mono", "IPAGothic", monospace;
    font-size: 0.85em; background: var(--plane); border-radius: 2px; padding: 0.05em 0.3em;
  }

  table { width: 100%; border-collapse: collapse; margin: 0.8mm 0 1.8mm; font-size: 8.1pt; line-height: 1.45; }
  tr { break-inside: avoid; }
  th, td { border-bottom: 1px solid var(--grid); padding: 0.8mm 1.6mm; text-align: left; vertical-align: top; }
  thead th { background: var(--plane); border-bottom: 1px solid var(--axis); font-weight: bold; }
  th:first-child, td:first-child { white-space: nowrap; width: 1%; }
  td[style*="right"], th[style*="right"] { text-align: right; white-space: nowrap; }

  /* 図の見出し（太字だけの段落）と、その直後の表・説明をひとまとまりに見せる */
  p:has(> strong:only-child) { margin: 2.4mm 0 0.6mm; font-size: 8.4pt; break-after: avoid; }
  p:has(> strong:only-child) + table { width: auto; min-width: 50%; margin-bottom: 0.8mm; break-inside: avoid; }
  p:has(> strong:only-child) + table th:first-child,
  p:has(> strong:only-child) + table td:first-child { width: auto; }
  p:has(> strong:only-child) + table + p { color: var(--ink-2); font-size: 8pt; }
</style>
</head>
<body>
$body$
</body>
</html>
